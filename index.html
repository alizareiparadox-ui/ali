<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>بوتیک علی</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Vazir&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Vazir', sans-serif;
      background-color: #fff;
      color: #333;
    }
    header {
      position: sticky;
      top: 0;
      background-color: #111;
      color: #fff;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }
    nav {
      display: flex;
      gap: 1.5rem;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #e60023;
    }

    .slider {
      overflow: hidden;
      position: relative;
      height: 400px;
    }
    .slide-container {
      display: flex;
      width: 300%;
      animation: slide 12s infinite;
    }
    .slide {
      width: 100%;
      object-fit: cover;
    }
    @keyframes slide {
      0% { transform: translateX(0%); }
      33% { transform: translateX(-100%); }
      66% { transform: translateX(-200%); }
      100% { transform: translateX(0%); }
    }

    .section-title {
      text-align: center;
      font-size: 1.8rem;
      margin: 2rem 0 1rem;
      color: #e60023;
    }

    .categories {
      padding: 2rem;
    }
    .category-grid {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }
    .category {
      text-align: center;
      transition: transform 0.3s;
    }
    .category:hover {
      transform: scale(1.05);
    }
    .category img {
      border-radius: 50%;
      width: 150px;
      height: 150px;
      object-fit: cover;
    }
    .category p {
      margin-top: 0.5rem;
      font-weight: bold;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
      padding: 2rem;
    }
    .product {
      background: #f8f8f8;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }
    .product:hover {
      transform: translateY(-5px);
    }
    .product img {
      width: 100%;
      height: 320px;
      object-fit: cover;
    }
    .product-info {
      padding: 1rem;
      text-align: center;
    }
    .product-info h3 {
      margin: 0.5rem 0;
      font-size: 1.2rem;
    }
    .product-info p {
      margin: 0.5rem 0;
      color: #666;
    }
    .product-info button {
      background-color: #e60023;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .product-info button:hover {
      background-color: #c4001f;
    }

    footer {
      background-color: #111;
      color: #fff;
      padding: 2rem;
      text-align: center;
      margin-top: 3rem;
    }
    footer a {
      color: #e60023;
      text-decoration: none;
      margin: 0 0.5rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>بوتیک علی</h1>
    <nav>
      <a href="#">خانه</a>
      <a href="#">زنانه</a>
      <a href="#">مردانه</a>
      <a href="#">اکسسوری</a>
      <a href="#">تماس با ما</a>
    </nav>
  </header>

  <section class="slider">
    <div class="slide-container">
      <img src="https://via.placeholder.com/1600x400?text=تخفیف+ویژه+پاییز" class="slide" />
      <img src="https://via.placeholder.com/1600x400?text=جدیدترین+مدل+ها" class="slide" />
      <img src="https://via.placeholder.com/1600x400?text=ارسال+رایگان+برای+سفارش+های+بالای+۵۰۰" class="slide" />
    </div>
  </section>

  <section class="categories">
    <h2 class="section-title">دسته‌بندی‌ها</h2>
    <div class="category-grid">
      <div class="category">
        <img src="https://via.placeholder.com/150?text=زنانه" alt="زنانه">
        <p>زنانه</p>
      </div>
      <div class="category">
        <img src="https://via.placeholder.com/150?text=مردانه" alt="مردانه">
        <p>مردانه</p>
      </div>
      <div class="category">
        <img src="https://via.placeholder.com/150?text=بچگانه" alt="بچگانه">
        <p>بچگانه</p>
      </div>
      <div class="category">
        <img src="https://via.placeholder.com/150?text=اکسسوری" alt="اکسسوری">
        <p>اکسسوری</p>
      </div>
    </div>
  </section>

  <h2 class="section-title">محصولات جدید</h2>
  <section class="products">
    <div class="product">
      <img src="https://via.placeholder.com/300x320?text=مانتو+شیک" alt="مانتو">
      <div class="product-info">
        <h3>مانتو کژوال</h3>
        <p>۴۸۰ هزار تومان</p>
        <button>افزودن به سبد</button>
      </div>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/300x320?text=پیراهن+مردانه" alt="پیراهن">
      <div class="product-info">
        <h3>پیراهن رسمی</h3>
        <p>۳۹۰ هزار تومان</p>
        <button>افزودن به سبد</button>
      </div>
    </div>
    <!-- محصولات بیشتر -->
  </section>

  <footer>
    <p>© ۲۰۲۵ بوتیک علی | طراحی با عشق</p>
    <p>
      <a href="#">اینستاگرام</a> |
      <a href="#">تلگرام</a> |
      <a href="#">تماس با ما</a>
    </p>
  </footer>

</body>
</html>
