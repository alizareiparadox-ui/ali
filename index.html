<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پلنر کنکور - برنامه مطالعاتی</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- هدر -->
        <header>
            <h1>📚 پلنر کنکور من</h1>
            <div class="days-counter">
                <span>🎯 روزهای مانده تا کنکور:</span>
                <span id="countdown">---</span>
            </div>
        </header>

        <!-- بخش دروس -->
        <div class="subjects-grid">
            <!-- زبان انگلیسی -->
            <div class="subject-card">
                <h2>🇬🇧 زبان انگلیسی</h2>
                <div class="checklist">
                    <label><input type="checkbox" class="task-check" data-subject="english" data-task="grammar"> گرامر</label>
                    <label><input type="checkbox" class="task-check" data-subject="english" data-task="idioms"> اصطلاحات</label>
                    <label><input type="checkbox" class="task-check" data-subject="english" data-task="phrasal"> اصطلاحات و فریزال ورب</label>
                    <label><input type="checkbox" class="task-check" data-subject="english" data-task="vocab"> وکب</label>
                    <label><input type="checkbox" class="task-check" data-subject="english" data-task="test70"> ۷۰ تست آزمون</label>
                    <label><input type="checkbox" class="task-check" data-subject="english" data-task="notes"> مرور دفتر نکات و لغات</label>
                    <label><input type="checkbox" class="task-check" data-subject="english" data-task="words1100"> ۱۱۰۰ لغت</label>
                </div>
                <div class="progress">
                    <div class="progress-bar" id="progress-english"></div>
                </div>
                <span class="progress-text" id="progress-text-english">0% تکمیل شده</span>
            </div>

            <!-- عربی -->
            <div class="subject-card">
                <h2>🕌 عربی</h2>
                <div class="checklist">
                    <label><input type="checkbox" class="task-check" data-subject="arabic" data-task="arabic-study"> مطالعه عربی</label>
                </div>
                <div class="progress">
                    <div class="progress-bar" id="progress-arabic"></div>
                </div>
                <span class="progress-text" id="progress-text-arabic">0% تکمیل شده</span>
            </div>

            <!-- ادبیات -->
            <div class="subject-card">
                <h2>📖 ادبیات</h2>
                <div class="checklist">
                    <label><input type="checkbox" class="task-check" data-subject="literature" data-task="literature-study"> مطالعه ادبیات</label>
                </div>
                <div class="progress">
                    <div class="progress-bar" id="progress-literature"></div>
                </div>
                <span class="progress-text" id="progress-text-literature">0% تکمیل شده</span>
            </div>

            <!-- دینی -->
            <div class="subject-card">
                <h2>☪️ دینی</h2>
                <div class="checklist">
                    <label><input type="checkbox" class="task-check" data-subject="religious" data-task="religious-study"> مطالعه دینی</label>
                </div>
                <div class="progress">
                    <div class="progress-bar" id="progress-religious"></div>
                </div>
                <span class="progress-text" id="progress-text-religious">0% تکمیل شده</span>
            </div>

            <!-- سلامت و بهداشت -->
            <div class="subject-card">
                <h2>🏥 سلامت و بهداشت</h2>
                <div class="checklist">
                    <label><input type="checkbox" class="task-check" data-subject="health" data-task="health-study"> مطالعه سلامت و بهداشت</label>
                </div>
                <div class="progress">
                    <div class="progress-bar" id="progress-health"></div>
                </div>
                <span class="progress-text" id="progress-text-health">0% تکمیل شده</span>
            </div>
        </div>

        <!-- پیشرفت کلی -->
        <div class="overall-progress">
            <h3>📊 پیشرفت کلی</h3>
            <div class="progress overall">
                <div class="progress-bar" id="progress-overall"></div>
            </div>
            <span class="progress-text" id="progress-text-overall">0% تکمیل شده</span>
        </div>

        <!-- دکمه ریست -->
        <button id="reset-btn" class="reset-button">🔄 شروع روز جدید</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
